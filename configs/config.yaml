defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

num_recommendations : 20
first_iteration_images_factor: 2
port: 8080
reconnect_timeout: 30
score_mode: emoji
device: cuda
image_display_size : [256, 256]
random_seed : 41
generator_warm_start: False
#hf_model_name: Lykon/dreamshaper-7  # SD1.5 single-encoder community checkpoint, 512x512 native
#hf_model_name: stable-diffusion-v1-5/stable-diffusion-v1-5  # base SD1.5, single text encoder, 512x512 native
hf_model_name: stabilityai/stable-diffusion-xl-base-1.0  # full-size base SDXL: best quality/highest VRAM (~7.85GB bf16 UNet+encoders alone, ~13GB peak with generator.batch_size:4 below); pair with generator.lora_name: latent-consistency/lcm-lora-sdxl and recommender.original_prompt_share: 0.5
#hf_model_name: segmind/SSD-1B  # SDXL distilled to ~50% smaller UNet: visible quality drop (confirmed reproducible even unquantized, e.g. blotchy/inconsistent fur texture artifacts) unless kept close to the prompt; pair with generator.lora_name: latent-consistency/lcm-lora-ssd-1b and recommender.original_prompt_share: 0.75
#hf_model_name: segmind/Segmind-Vega  # SDXL distilled to ~70% smaller UNet: more aggressive quality drop than SSD-1B, not yet profiled here; pair with generator.lora_name: segmind/Segmind-VegaRT

# QUANTIZATION: bitsandbytes quantization applied to the UNet only (VAE/text encoders are already
# small enough that diffusers' own docs say not to bother). Requires the `bitsandbytes` package
# (see requirements.txt). Measured on segmind/SSD-1B + latent-consistency/lcm-lora-ssd-1b at
# generator.batch_size: 4, on an H100.
#quantize_unet: null  # no quantization, full bf16 UNet, LoRA gets fused: best quality/speed, highest VRAM (~10.6GB with SSD-1B above)
#quantize_unet: "8bit"  # bitsandbytes int8 (LLM.int8()): only modest VRAM savings (~9.2GB) and noticeably slower than 4bit below since the LoRA can no longer be fused into quantized weights; needs GPU compute capability >= 7.5 (Turing+)
quantize_unet: "4bit"  # bitsandbytes NF4: best VRAM/speed/quality trade-off found so far (~8.9GB); needs GPU compute capability >= 6.0 (Pascal+)

# SDXL MIGRATION: SDXL's native resolution is 1024x1024 (vs. SD1.5's 512x512). Referenced from
# both the `generator:` and `recommender:` sections below via YAML anchor/alias so Generator and
# UserProfileHost (which both used to hardcode height=width=512) stay in sync.
image_size: &image_size 1024

generator:
  num_inference_steps : 4
  guidance_scale: 0.0
  use_negative_prompt : False
  lora_name: latent-consistency/lcm-lora-sdxl  # matches hf_model_name: stabilityai/stable-diffusion-xl-base-1.0
  #lora_name: latent-consistency/lcm-lora-ssd-1b  # matches hf_model_name: segmind/SSD-1B
  #lora_name: segmind/Segmind-VegaRT  # matches hf_model_name: segmind/Segmind-Vega
  batch_size: 4
  initial_latent_seed: 42
  height: *image_size
  width: *image_size

recommender:
  axis_style: ordered
  n_embedding_axis : 32
  use_embedding_center : False
  n_latent_axis : 32
  use_latent_center : False
  ema_alpha : 0.5
  beta: 0.3
  beta_step_size: 0.2
  latent_axes_seed: 42
  recommendation_seed: 43
  initial_recommendation_seed: 44
  prompts_seed: 44
  latent_space_length: 15.8
  height: *image_size
  width: *image_size
  # SDXL MIGRATION: this value was tuned for SD1.5's single-encoder embedding geometry
  # (0.0 for models like Lykon/dreamshaper-7, 0.75 for stable-diffusion-v1-5). SDXL's concatenated
  # 2048-dim dual-encoder embedding space has different norm/distance properties, so this share
  # will likely need to be re-tuned experimentally rather than reused as-is.
  # Re-tuned values found by testing (2026-08-02): use 0.5 with hf_model_name:
  # stabilityai/stable-diffusion-xl-base-1.0 (good quality + variety at this value). If using
  # hf_model_name: segmind/SSD-1B instead, use 0.75 — SSD-1B's distilled UNet produces visibly
  # degraded/malformed results at lower shares, seemingly less robust to the wider variety of
  # axis prompts explored at lower values than full SDXL is.
  original_prompt_share: 0.4

path:
  output_dir: ./output/
  cache_dir: ./cache/
  images_save_dir: ./saved_images/